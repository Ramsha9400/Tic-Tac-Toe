<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe Game – Split Screen | @stackanddstyle</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a16;--panel:#0d1124;--line:rgba(255,255,255,.1);--text:#eef0ff;--muted:#9aa0c3;--accent:#7c5cff;--accent-2:#22d3ee}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 28px}
.brand{font-weight:600;font-size:1.05rem;display:flex;align-items:center;gap:10px}
.brand small{color:var(--muted);font-weight:400;font-size:.8rem}
.dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 12px var(--accent)}
.by{font-size:.82rem;color:var(--muted);padding:7px 16px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.by b{color:var(--text);font-weight:600}
.split{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:0 28px 24px}
.pane{display:flex;flex-direction:column;min-height:0;border-radius:18px;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.5)}
.bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.03);font-size:.8rem;color:var(--muted)}
.bar i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.bar span{margin-left:8px}
iframe{flex:1;border:0;width:100%;background:var(--bg)}
.tabs{display:flex;gap:4px;margin-left:12px}
.tab{font:500 .82rem 'Poppins',sans-serif;color:var(--muted);background:none;border:0;padding:8px 18px;border-radius:9px;cursor:pointer;transition:background .25s,color .25s}
.tab svg{width:17px;height:17px;margin-right:8px;vertical-align:-3px}.ic{display:flex;gap:7px}.ic svg{width:22px;height:22px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);background:rgba(255,255,255,.09);box-shadow:inset 0 -2px 0 var(--c)}
.tab[data-t=html]{--c:#ff7a45}.tab[data-t=css]{--c:#4da3ff}.tab[data-t=js]{--c:#f7d84a}
.file{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:.75rem}
#copy{font:500 .75rem 'Poppins',sans-serif;color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line);padding:6px 14px;border-radius:8px;cursor:pointer;transition:background .2s}
#copy:hover{background:rgba(124,92,255,.35)}
.codewrap{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#2c3260 transparent}
pre{padding:20px 22px;font:400 .8rem/1.7 'JetBrains Mono',ui-monospace,Consolas,monospace;tab-size:2;color:#d6d9f5}
.c{color:#5d6494;font-style:italic}.s{color:#9be08a}.k{color:#c792ff}.t{color:#ff7a8a}.a{color:#ffcb6b}.n{color:#f78c6c}.f{color:#6cc8ff}.p{color:#82aaff}
@media(max-width:900px){body{overflow:auto}.split{grid-template-columns:1fr;grid-auto-rows:80vh}}
</style>
</head>

        <button class="tab" data-t="css" role="tab"><svg viewBox="0 0 24 24"><path d="M3 2l1.7 19L12 23l7.3-2L21 2z" fill="#1572b6"/><path d="M12 4v17.2l5.6-1.5L19.1 4z" fill="#33a9dc"/><text x="12" y="16" font-size="10" font-weight="700" fill="#fff" text-anchor="middle" font-family="Poppins,sans-serif">3</text></svg>CSS</button>

<script>
const SRC = {"html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Tic Tac Toe Game | @stackanddstyle<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap\" rel=\"stylesheet\">\n  <link rel=\"stylesheet\" href=\"style.css\">\n<\/head>\n<body>\n  <main class=\"stage\">\n    <section class=\"game\">\n      <button class=\"sound\" id=\"sound\" aria-label=\"Sound on\" aria-pressed=\"true\">\n        <svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n          <path d=\"M11 5L6 9H3v6h3l5 4z\"/><path class=\"w\" d=\"M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13\"/><path class=\"m\" d=\"M16 9l5 6M21 9l-5 6\"/>\n        <\/svg>\n      <\/button>\n      <h1>Tic Tac Toe<\/h1>\n\n      <div class=\"seg-group\" id=\"modes\" role=\"group\" aria-label=\"Game mode\">\n        <button class=\"seg on\" data-mode=\"pvp\">2 Players<\/button>\n        <button class=\"seg\" data-mode=\"cpu\" id=\"cpuBtn\">vs Computer<\/button>\n      <\/div>\n      <div class=\"seg-group small\" id=\"levels\" role=\"group\" aria-label=\"Difficulty\" hidden>\n        <button class=\"seg\" data-level=\"easy\">Easy<\/button>\n        <button class=\"seg on\" data-level=\"hard\">Hard<\/button>\n      <\/div>\n\n      <div class=\"score\" aria-label=\"Scoreboard\">\n        <div class=\"s x\"><b id=\"sx\">0<\/b><span id=\"lx\">X wins<\/span><\/div>\n        <div class=\"s d\"><b id=\"sd\">0<\/b><span>Draws<\/span><\/div>\n        <div class=\"s o\"><b id=\"so\">0<\/b><span id=\"lo\">O wins<\/span><\/div>\n      <\/div>\n\n      <p class=\"turn\" id=\"turn\" aria-live=\"polite\"><\/p>\n\n      <div class=\"board\" id=\"board\"><button class=\"cell\" data-i=\"0\" aria-label=\"Row 1, column 1, empty\"><\/button><button class=\"cell\" data-i=\"1\" aria-label=\"Row 1, column 2, empty\"><\/button><button class=\"cell\" data-i=\"2\" aria-label=\"Row 1, column 3, empty\"><\/button><button class=\"cell\" data-i=\"3\" aria-label=\"Row 2, column 1, empty\"><\/button><button class=\"cell\" data-i=\"4\" aria-label=\"Row 2, column 2, empty\"><\/button><button class=\"cell\" data-i=\"5\" aria-label=\"Row 2, column 3, empty\"><\/button><button class=\"cell\" data-i=\"6\" aria-label=\"Row 3, column 1, empty\"><\/button><button class=\"cell\" data-i=\"7\" aria-label=\"Row 3, column 2, empty\"><\/button><button class=\"cell\" data-i=\"8\" aria-label=\"Row 3, column 3, empty\"><\/button><\/div>\n\n      <div class=\"actions\">\n        <button class=\"btn\" id=\"restart\">Restart<\/button>\n        <button class=\"btn ghost\" id=\"reset\">Reset score<\/button>\n      <\/div>\n      <p class=\"hint\">Tip: press <kbd>1<\/kbd>-<kbd>9<\/kbd> to play, <kbd>R<\/kbd> to restart, <kbd>M<\/kbd> to mute<\/p>\n    <\/section>\n  <\/main>\n\n  <a class=\"credit\" href=\"#\">Created by <b>@stackanddstyle<\/b><\/a>\n  <script src=\"script.js\"><\/script>\n<\/body>\n<\/html>\n", "css": "/* ====== CHANGE COLORS HERE ====== */\n:root{\n  --bg:#e5e8f6;            /* soft base colour (everything is made from it) */\n  --light:#ffffff;         /* top-left highlight */\n  --dark:#b8bfdc;          /* bottom-right shadow */\n  --ink:#2a2c4a; --muted:#7c80a6;\n  --x:#6d4cf0;             /* player X */\n  --o:#0aa9bd;             /* player O */\n}\n*{margin:0;padding:0;box-sizing:border-box}\nbody{\n  min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);\n  font-family:'Poppins',system-ui,sans-serif;-webkit-font-smoothing:antialiased;\n}\n.stage{padding:24px}\n.game{position:relative;width:min(360px,92vw);display:grid;gap:15px;justify-items:center}\nh1{font-size:1.6rem;font-weight:600;letter-spacing:.3px}\n\n/* sound button + mode switches */\n.sound{position:absolute;right:0;top:0;width:40px;height:40px;border:0;border-radius:50%;background:var(--bg);color:var(--ink);cursor:pointer;\n  display:grid;place-items:center;box-shadow:4px 4px 9px var(--dark),-4px -4px 9px var(--light);transition:box-shadow .25s}\n.sound:hover{box-shadow:inset 3px 3px 6px var(--dark),inset -3px -3px 6px var(--light)}\n.sound .m{display:none}.sound[aria-pressed=\"false\"] .m{display:block}.sound[aria-pressed=\"false\"] .w{display:none}\n.seg-group{display:flex;gap:4px;padding:5px;border-radius:99px;box-shadow:inset 4px 4px 9px var(--dark),inset -4px -4px 9px var(--light)}\n.seg-group[hidden]{display:none}\n.seg{border:0;background:none;color:var(--muted);cursor:pointer;padding:9px 20px;border-radius:99px;font:500 .82rem 'Poppins',sans-serif;transition:all .3s}\n.seg-group.small .seg{padding:6px 18px;font-size:.75rem}\n.seg.on{background:var(--bg);color:var(--ink);box-shadow:4px 4px 9px var(--dark),-4px -4px 9px var(--light)}\n.seg:focus-visible{outline:2px solid var(--x);outline-offset:2px}\n\n/* ---- soft (neumorphic) shadows: one recipe used everywhere ---- */\n.score,.cell,.btn{box-shadow:6px 6px 14px var(--dark),-6px -6px 14px var(--light)}\n\n.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;padding:12px;border-radius:20px;\n  box-shadow:inset 4px 4px 9px var(--dark),inset -4px -4px 9px var(--light)}\n.s{text-align:center}\n.s b{display:block;font-size:1.5rem;font-weight:600;line-height:1.2}\n.s span{font-size:.7rem;color:var(--muted)}\n.s.x b{color:var(--x)}.s.o b{color:var(--o)}\n\n.turn{display:flex;align-items:center;gap:10px;font-weight:500;min-height:1.6em;transition:color .3s}\n.turn .dot{width:10px;height:10px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}\n.turn[data-p=\"X\"]{color:var(--x)}.turn[data-p=\"O\"]{color:var(--o)}.turn[data-p=\"D\"]{color:var(--muted)}\n.turn.end{font-size:1.15rem;font-weight:600;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}\n\n.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%}\n.cell{\n  aspect-ratio:1;border:0;border-radius:18px;background:var(--bg);cursor:pointer;\n  font:300 2.8rem 'Poppins',sans-serif;color:var(--ink);\n  transition:box-shadow .25s,transform .25s,opacity .3s;-webkit-tap-highlight-color:transparent;\n}\n.cell:not(.taken):hover{box-shadow:inset 5px 5px 10px var(--dark),inset -5px -5px 10px var(--light)}\n.cell:active{transform:scale(.95)}\n.cell:focus-visible{outline:2px solid var(--x);outline-offset:3px}\n.cell.taken{cursor:default}\n.cell.x{color:var(--x)}.cell.o{color:var(--o)}\n.cell.taken{animation:pop .35s cubic-bezier(.3,1.7,.5,1)}\n.over .cell:not(.win){opacity:.45}\n.cell.win{opacity:1;animation:glow 1.1s ease-in-out infinite alternate;\n  box-shadow:inset 4px 4px 9px var(--dark),inset -4px -4px 9px var(--light)}\n.cell.win{text-shadow:0 0 18px currentColor,0 0 4px currentColor}\n@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}\n@keyframes glow{to{text-shadow:0 0 34px currentColor,0 0 8px currentColor}}\n\n.actions{display:flex;gap:14px}\n.btn{border:0;border-radius:99px;padding:11px 26px;background:var(--bg);color:var(--ink);cursor:pointer;\n  font:500 .85rem 'Poppins',sans-serif;transition:box-shadow .25s,transform .2s}\n.btn:hover{box-shadow:inset 4px 4px 8px var(--dark),inset -4px -4px 8px var(--light)}\n.btn:active{transform:scale(.96)}\n.btn.ghost{color:var(--muted)}\n.hint{font-size:.78rem;color:var(--muted)}\nkbd{font:500 .7rem 'Poppins';padding:2px 8px;border-radius:6px;background:var(--bg);box-shadow:2px 2px 5px var(--dark),-2px -2px 5px var(--light)}\n.credit{position:fixed;right:18px;bottom:16px;padding:8px 16px;border-radius:999px;text-decoration:none;font-size:.78rem;\n  color:var(--muted);background:var(--bg);box-shadow:4px 4px 10px var(--dark),-4px -4px 10px var(--light)}\n.credit b{color:var(--ink);font-weight:600}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}\n", "js": "const cells = [...document.querySelectorAll('.cell')];\nconst boardEl = document.getElementById('board');\nconst turnEl = document.getElementById('turn');\nconst levelsEl = document.getElementById('levels');\nconst soundBtn = document.getElementById('sound');\nconst WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];\nconst score = { X: 0, O: 0, D: 0 };\nlet board, player, over, busy = false;\nlet mode = 'pvp', level = 'hard';          // pvp = two players, cpu = you (X) vs computer (O)\n\n/* ================= SOUND (made with the Web Audio API, no files needed) ================= */\nlet ctx, muted = false;\nfunction tone(freq, start, dur, { type = 'triangle', vol = 0.25, slide } = {}) {\n  if (muted) return;\n  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();\n  const t = ctx.currentTime + start, o = ctx.createOscillator(), g = ctx.createGain();\n  o.type = type;\n  o.frequency.setValueAtTime(freq, t);\n  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);\n  g.gain.setValueAtTime(vol, t);\n  g.gain.exponentialRampToValueAtTime(0.001, t + dur);\n  o.connect(g).connect(ctx.destination);\n  o.start(t); o.stop(t + dur);\n}\nconst sfx = {\n  x:       () => { tone(660, 0, .14); tone(140, 0, .1, { type: 'sine', vol: .35 }); },\n  o:       () => { tone(495, 0, .14); tone(120, 0, .1, { type: 'sine', vol: .35 }); },\n  win:     () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .11, .38, { vol: .22 })),\n  draw:    () => { tone(392, 0, .22); tone(330, .18, .32); },\n  restart: () => tone(300, 0, .2, { type: 'sine', slide: 900, vol: .2 }),\n  mode:    () => { tone(600, 0, .08, { type: 'sine' }); tone(800, .08, .1, { type: 'sine' }); }\n};\nfunction toggleSound() {\n  muted = !muted;\n  soundBtn.setAttribute('aria-pressed', !muted);\n  soundBtn.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on');\n}\n\n/* ================= COMPUTER PLAYER ================= */\nconst winner = b => { const l = WINS.find(l => l.every(k => b[k] && b[k] === b[l[0]])); return l ? b[l[0]] : null; };\nconst empties = b => b.map((v, i) => v ? -1 : i).filter(i => i >= 0);\n\nfunction minimax(b, turn) {                          // +1 = computer (O) wins, -1 = you win, 0 = draw\n  const w = winner(b);\n  if (w) return w === 'O' ? 1 : -1;\n  const free = empties(b);\n  if (!free.length) return 0;\n  const scores = free.map(i => { b[i] = turn; const s = minimax(b, turn === 'O' ? 'X' : 'O'); b[i] = ''; return s; });\n  return turn === 'O' ? Math.max(...scores) : Math.min(...scores);\n}\n\nfunction pickMove() {\n  const free = empties(board);\n  const tryFor = who => free.find(i => { board[i] = who; const w = winner(board) === who; board[i] = ''; return w; });\n  if (level === 'easy') {                            // easy: takes a win if it sees one, otherwise random\n    const win = tryFor('O');\n    return win !== undefined ? win : free[Math.floor(Math.random() * free.length)];\n  }\n  let best = -2, move = free[0];                     // hard: perfect play, it can never lose\n  [4, 0, 2, 6, 8, 1, 3, 5, 7].filter(i => !board[i]).forEach(i => {\n    board[i] = 'O'; const s = minimax(board, 'X'); board[i] = '';\n    if (s > best) { best = s; move = i; }\n  });\n  return move;\n}\n\n/* ================= GAME ================= */\nconst label = (i, m) => `Row ${Math.floor(i / 3) + 1}, column ${(i % 3) + 1}, ${m || 'empty'}`;\n\nfunction showTurn() {\n  turnEl.className = 'turn';\n  turnEl.dataset.p = player;\n  turnEl.innerHTML = `<i class=\"dot\"><\/i>${mode === 'cpu' ? (player === 'X' ? 'Your turn' : 'Computer is thinking...') : player + \"'s turn\"}`;\n}\n\nfunction renderScore() {\n  document.getElementById('sx').textContent = score.X;\n  document.getElementById('so').textContent = score.O;\n  document.getElementById('sd').textContent = score.D;\n  document.getElementById('lx').textContent = mode === 'cpu' ? 'You' : 'X wins';\n  document.getElementById('lo').textContent = mode === 'cpu' ? 'Computer' : 'O wins';\n}\n\nfunction start() {                                   // new round (X always starts)\n  board = Array(9).fill('');\n  player = 'X'; over = false; busy = false;\n  boardEl.classList.remove('over');\n  cells.forEach((c, i) => { c.textContent = ''; c.className = 'cell'; c.setAttribute('aria-label', label(i)); });\n  showTurn();\n}\n\nfunction finish(who, line = []) {\n  over = true;\n  boardEl.classList.add('over');\n  if (who) { score[who]++; line.forEach(k => cells[k].classList.add('win')); } else score.D++;\n  renderScore();\n  turnEl.className = 'turn end';\n  turnEl.dataset.p = who || 'D';\n  turnEl.textContent = !who ? \"It's a draw\" : mode === 'cpu' ? (who === 'X' ? 'You win!' : 'Computer wins!') : `${who} wins!`;\n  setTimeout(who ? sfx.win : sfx.draw, 180);\n}\n\nfunction play(i) {\n  if (over || busy || board[i]) return;\n  board[i] = player;\n  cells[i].textContent = player;\n  cells[i].classList.add('taken', player.toLowerCase());\n  cells[i].setAttribute('aria-label', label(i, player));\n  sfx[player.toLowerCase()]();\n\n  const line = WINS.find(l => l.every(k => board[k] === player));\n  if (line) return finish(player, line);\n  if (board.every(Boolean)) return finish(null);\n\n  player = player === 'X' ? 'O' : 'X';\n  showTurn();\n  if (mode === 'cpu' && player === 'O') {            // computer answers after a short pause\n    busy = true;\n    setTimeout(() => { busy = false; play(pickMove()); }, 550);\n  }\n}\n\nfunction setMode(m) {\n  mode = m;\n  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));\n  levelsEl.hidden = m !== 'cpu';\n  score.X = score.O = score.D = 0;                   // new match-up = fresh score\n  renderScore(); start(); sfx.mode();\n}\n\ndocument.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));\ndocument.querySelectorAll('[data-level]').forEach(b => b.addEventListener('click', () => {\n  level = b.dataset.level;\n  document.querySelectorAll('[data-level]').forEach(x => x.classList.toggle('on', x === b));\n  score.X = score.O = score.D = 0; renderScore(); start(); sfx.mode();\n}));\ncells.forEach((c, i) => c.addEventListener('click', () => play(i)));\ndocument.getElementById('restart').addEventListener('click', () => { start(); sfx.restart(); });\ndocument.getElementById('reset').addEventListener('click', () => { score.X = score.O = score.D = 0; renderScore(); start(); sfx.restart(); });\nsoundBtn.addEventListener('click', toggleSound);\n\naddEventListener('keydown', e => {                   // 1-9 = cells, R = restart, M = mute\n  if (e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/[1-9]/.test(e.key)) play(+e.key - 1);\n  if (e.key.toLowerCase() === 'r') { start(); sfx.restart(); }\n  if (e.key.toLowerCase() === 'm') toggleSound();\n});\n\nstart();\nrenderScore();\n"};

const RULES = {
  html: [/(<!--[\s\S]*?-->)|(<\/?[a-zA-Z][\w-]*)|("[^"]*")|(\s[\w:-]+(?==))|(\/?>)/g, ['c','t','s','a','t']],
  css:  [/(\/\*[\s\S]*?\*\/)|("[^"]*"|'[^']*')|(@[\w-]+|[.#][a-zA-Z_][\w-]*)|(--[\w-]+|[a-z-]+(?=\s*:))|(#[0-9a-fA-F]{3,8}\b|\b\d*\.?\d+(?:px|rem|em|vw|vh|deg|s|ms|%)?)/g, ['c','s','t','p','n']],
  js:   [/(\/\/.*|\/\*[\s\S]*?\*\/)|(`[^`]*`|"[^"]*"|'[^']*')|\b(const|let|var|function|return|if|else|new|try|catch|true|false|document|window)\b|(\b\d+\.?\d*\b)|(\b[a-zA-Z_$][\w$]*(?=\())/g, ['c','s','k','n','f']]
};
function hl(code, lang){
  const [re, cls] = RULES[lang]; let out = '', last = 0;
  code.replace(re, (m, ...g) => {
    const off = g[g.length-2]; const i = g.slice(0, cls.length).findIndex(x => x !== undefined);
    out += esc(code.slice(last, off)) + '<span class="'+cls[i]+'">'+esc(m)+'</span>'; last = off + m.length; return m;
  });
  return out + esc(code.slice(last));
}
let cur = 'html';
function show(t){
  cur = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  document.getElementById('code').innerHTML = hl(SRC[t], t);
  document.getElementById('file').textContent = FILES[t];
  document.getElementById('wrap').scrollTop = 0;
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => show(b.dataset.t)));
document.getElementById('copy').addEventListener('click', e => {
  navigator.clipboard && navigator.clipboard.writeText(SRC[cur]).then(() => {
    e.target.textContent = 'Copied ✓'; setTimeout(() => e.target.textContent = 'Copy', 1400);
  });
});
show('html');
</script>
